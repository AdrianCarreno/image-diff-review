name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-commit:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      # The PR title becomes the squash-merge commit, which decides the next version.
      - name: Check the PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
