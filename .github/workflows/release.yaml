name: Release

on:
  push:
    branches: [main]

# Releases run one at a time, so back-to-back merges get consecutive versions.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Checks out the tip of main (not the triggering commit), so a queued run sees the previous
      # run's release commit and only releases what was merged after it.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Bump version, tag, and publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uvx --from python-semantic-release==10.7.0 semantic-release -v version
