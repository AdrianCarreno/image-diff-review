[project]
name = "image-diff-review"
version = "1.0.0"
description = "Review expected-image fixture changes on a PR branch, ignoring \"Data as of\" label churn"
readme = "README.md"
authors = [
    { name = "Adrian Carreno", email = "acarreno@ycharts.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "numpy",
    "opencv-python-headless",
    "pytesseract",
    "regex>=2026.9.29",
]

[project.scripts]
image-diff-review = "image_diff_review.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "ty==0.0.84",
    "types-regex==2026.9.29.20261005",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
possibly-unresolved-reference = "error"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
commit_message = "chore(release): {version}"
build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
"""

[tool.semantic_release.branches.main]
match = "main"

[tool.semantic_release.commit_parser_options]
# Squash merges put the PR's commit list in the body; only the PR title decides the bump.
parse_squash_commits = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
