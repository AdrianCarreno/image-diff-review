[project]
name = "image-diff-review"
version = "1.0.0"
description = "Review expected-image fixture changes on a PR branch, ignoring \"Data as of\" label churn"
readme = "README.md"
authors = [
    { name = "Adrian Carreno", email = "acarreno@ycharts.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "pytesseract",
]

[project.scripts]
image-diff-review = "image_diff_review.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff==0.16.9",
    "ty==0.0.84",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
possibly-unresolved-reference = "error"
